name: Windows 打包并发布到 Gitee

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 Windows 自绘安装包
    if: github.repository == 'ksdhyPro/OrbitSSH'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装锁定依赖
        run: npm ci
      - name: 构建应用与自绘安装器
        # 复用原有安装器；云端使用官方默认下载源。
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-windows-installer.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 校验并整理发布文件
        run: node scripts/publish-gitee-release.cjs --prepare
      - name: 保存安装包与校验文件
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.sha }}
          path: release/ci/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 回传 Gitee 发行版
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-${{ github.sha }}
          path: release/ci
      - name: 创建发行版并上传安装包
        env:
          # 在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置。
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
        run: node scripts/publish-gitee-release.cjs
