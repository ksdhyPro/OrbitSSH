interface:
  display_name: "OrbitSSH MCP"
  short_description: "通过 OrbitSSH 保存的连接操作远程服务器"
  default_prompt: "使用 $orbitssh-mcp 检查我在 OrbitSSH 中保存的服务器。"

dependencies:
  tools:
    - type: "mcp"
      value: "orbitssh"
      description: "OrbitSSH 本地 MCP 服务器"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
